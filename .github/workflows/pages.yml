name: Pages

# Builds the browser version (web/) and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wasi-libc libc++-18-dev-wasm32 libclang-rt-18-dev-wasm32

      - name: Build engine (WebAssembly)
        run: CXX=clang++-18 ./web/build.sh

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/style.css web/app.js web/worklet.js web/teng40.wasm _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
